name: Bug report
description: Report a reproducible CCC behavior problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide a minimum reproducible example, not a full conversation.

        Do not submit credentials, real resumes, offers, contracts, salary screenshots, private contact details, or confidential employer information.
  - type: input
    id: platform
    attributes:
      label: Platform / 平台
      placeholder: "Example: WorkBuddy, ChatGPT, Codex, Claude Code"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model, if known / 模型（如果知道）
      placeholder: "Example: unknown, GPT-5, Claude, WorkBuddy default"
  - type: dropdown
    id: language
    attributes:
      label: Language / 使用语言
      options:
        - 中文
        - English
        - Other
    validations:
      required: true
  - type: textarea
    id: step
    attributes:
      label: What happened? / 发生了什么？
    validations:
      required: true
  - type: textarea
    id: mre
    attributes:
      label: Minimal reproduction / 最小复现
      description: Use synthetic or anonymized input only.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output / 实际输出
      description: A short excerpt is enough.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: dropdown
    id: reproducible
    attributes:
      label: Reproducible? / 是否可重复？
      options:
        - Yes
        - No
        - Not sure
    validations:
      required: true
